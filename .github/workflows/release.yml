name: Release

# Builds the CLI for every platform. The engine is released separately by
# lafke/engine-releases. The release is created as a draft with every asset attached,
# then published only after all attestations have succeeded, so /releases/latest never
# points at an unattested release. Immutable releases need the assets in place before
# publish.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check that the tag points at main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          tag_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          if [ "$tag_commit" != "$main_commit" ]; then
            echo "$TAG must point at the current main commit of $GITHUB_REPOSITORY." >&2
            echo "tag:  $tag_commit" >&2
            echo "main: $main_commit" >&2
            exit 1
          fi

  package:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Package
        run: sh scripts/package.sh ${{ matrix.goos }} ${{ matrix.goarch }} "${{ github.ref_name }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  sbom:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: SPDX SBOMs
        run: |
          go build -o "$RUNNER_TEMP/lafke" ./cmd/lafke
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          mkdir dist
          "$RUNNER_TEMP/lafke" lock . --offline --no-fail
          "$RUNNER_TEMP/lafke" sbom export . --spec spdx --offline > dist/lafke.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sbom
          path: dist/*
          if-no-files-found: error

  draft:
    needs: [package, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum lafke* > checksums.txt
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          {
            echo "## Changelog"
            git log --no-merges --format='* %H %s' "${prev:+${prev}..}${TAG}" \
              | grep -Ev '^\* [0-9a-f]+ (docs|test|chore):' | LC_ALL=C sort -k3
            echo
          } > notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag \
            --draft
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  attest:
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Extract binaries
        run: |
          for a in dist/*.tar.gz; do
            d="bin/$(basename "$a" .tar.gz)"; mkdir -p "$d"; tar -xzf "$a" -C "$d"
          done
          for a in dist/*.zip; do
            d="bin/$(basename "$a" .zip)"; mkdir -p "$d"; unzip -q "$a" -d "$d"
          done
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.zip
            dist/*.spdx.json
            bin/*/lafke
            bin/*/lafke.exe
      - name: Attest CLI SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            bin/*/lafke
            bin/*/lafke.exe
          sbom-path: dist/lafke.spdx.json

  publish:
    needs: [draft, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
