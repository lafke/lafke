name: Build

# Builds the CLI for every release platform, so a broken build is found before a release
# is cut. The engine is built and released by lafke/engine-releases.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Package
        run: sh scripts/package.sh ${{ matrix.goos }} ${{ matrix.goarch }} dev
      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir smoke && tar -xzf dist/lafke_linux_amd64.tar.gz -C smoke
          smoke/lafke version
          smoke/lafke engine install
          smoke/lafke engine status
          mkdir sample && printf 'package main\n\nfunc main() {}\n' > sample/main.go
          (cd sample && ../smoke/lafke sast . --offline)
