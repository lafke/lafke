name: Build

# Builds the CLI and the engine from their main branches for every release platform, so
# a broken combination is found before a release is cut.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lafke/engine
          path: engine
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            engine/go.sum
      - name: Package
        run: sh scripts/package.sh ${{ matrix.goos }} ${{ matrix.goarch }} dev
      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          mkdir smoke && tar -xzf dist/lafke_linux_amd64.tar.gz -C smoke
          smoke/lafke version
          smoke/lafke-engine version
          mkdir sample && printf 'package main\n\nfunc main() {}\n' > sample/main.go
          (cd sample && ../smoke/lafke sast . --offline)
