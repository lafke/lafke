name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Token with read access to the engine repository. Without it (for example on pull
  # requests from forks) the tests that need the engine are skipped.
  HAS_ENGINE_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN != '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build engine
        if: env.HAS_ENGINE_TOKEN == 'true'
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.ENGINE_REPO_TOKEN }}@github.com/lafke/engine.git" "$RUNNER_TEMP/engine"
          rustup toolchain install stable --profile minimal
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/engine/rust/Cargo.toml"
          cp "$RUNNER_TEMP/engine/rust/target/release/lafke-engine" "$RUNNER_TEMP/lafke-engine"
          echo "LAFKE_ENGINE=$RUNNER_TEMP/lafke-engine" >> "$GITHUB_ENV"
      - name: Test
        run: go test ./...
      - name: Action script
        run: bash action/run_test.sh

  # The combination users run: this CLI with the newest released engine. The public
  # release needs no secret, so this also runs on pull requests from forks. Some tests
  # replace HOME, which hides the install directory, so the installed engine is passed
  # through LAFKE_ENGINE.
  test-released-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install released engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go build -o bin/ ./cmd/lafke
          bin/lafke engine install
          bin/lafke engine status
          echo "LAFKE_ENGINE=$(find "$HOME/.cache/lafke/engine" -name lafke-engine -type f)" >> "$GITHUB_ENV"
      - name: Test
        run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Race
        run: go test -race ./...

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l cmd internal pkg schemas)"
      - name: Vet
        run: go vet ./...
      - name: Vet (Windows)
        run: GOOS=windows go vet ./...
      - name: Tidy
        run: go mod tidy && git diff --exit-code
      - name: Build
        run: go build -o bin/ ./cmd/lafke
      - name: Examples
        run: |
          for d in examples/*/; do
            bin/lafke verify --offline "$d"
          done

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o bin/ ./cmd/lafke
      - name: Version
        shell: bash
        run: bin/lafke version
      - name: Verify examples
        shell: bash
        run: |
          for d in examples/*/; do
            bin/lafke verify --offline "$d"
          done
