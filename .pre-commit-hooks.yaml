# Hooks for https://pre-commit.com. See "Pre-commit" in website/guide/usage.md.
#
# Both hooks run only when a lockfile, lafke.lock, or the exceptions file is staged, and
# check the whole project: the staged files say when to look, not what to look at.
# They look packages up online like the CLI does; add `args: [--offline]` to skip that,
# which leaves remote evidence unknown.
- id: lafke-verify
  name: lafke verify
  description: Fail when dependencies drift from lafke.lock
  entry: lafke verify
  language: golang
  pass_filenames: false
  files: '(^|/)(lafke\.lock|\.lafke/.*|package-lock\.json|package\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?|deno\.lock|Cargo\.lock|go\.(mod|sum)|uv\.lock|poetry\.lock|pdm\.lock|Pipfile\.lock|composer\.lock|Gemfile\.lock|packages\.lock\.json|Package\.resolved|Podfile\.lock|conan\.lock|renv\.lock|Manifest\.toml|cabal\.project\.freeze|pubspec\.lock|mix\.lock|gradle\.lockfile)$'

- id: lafke-audit
  name: lafke audit
  description: Fail on dependency findings at or above high severity
  entry: lafke audit
  language: golang
  pass_filenames: false
  files: '(^|/)(lafke\.lock|\.lafke/.*|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?|deno\.lock|Cargo\.lock|go\.(mod|sum)|uv\.lock|poetry\.lock|pdm\.lock|Pipfile\.lock|composer\.lock|Gemfile\.lock|packages\.lock\.json|Package\.resolved|Podfile\.lock|conan\.lock|renv\.lock|Manifest\.toml|cabal\.project\.freeze|pubspec\.lock|mix\.lock|gradle\.lockfile)$'
